<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1017">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Daily Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE: calm morning glance, quick to scan, a little bit of radio warmth
   IDEA: a bedside clock radio: sky panel up top, FM dial for the music card
   PICTURE: the live weather panel with a drawn sky icon and 5-day strip
   COLOUR and TYPE: sky blue field, ink ground, signal orange accent; Space Grotesk + Inter
   LAYOUT: two-row grid on desktop (weather|fact, news|music); stacked on phone */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1017);--card:light-dark(#f3f4f6,#171a24);--ink:light-dark(#12141c,#eef0f6);--mut:light-dark(#5b6070,#9aa0b2);--line:light-dark(#e2e4ea,#262a37);--acc:#ff5a36;--sky1:light-dark(#2b63ff,#16245c);--sky2:light-dark(#5f8dff,#2c418f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
h1,h2,.big{font-family:"Space Grotesk",Inter,sans-serif;margin:0}
h2{font-size:18px;font-weight:700;margin-bottom:12px}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(16px,3vw,36px) max(4vw,14px) 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;margin-bottom:20px}
header h1{font-size:clamp(28px,4vw,44px);line-height:1.05;text-wrap:balance}
#date{color:var(--mut);font-size:16px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:20px;padding:20px}
#wx{grid-column:span 7;background:linear-gradient(160deg,var(--sky1),var(--sky2));color:#fff;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;min-height:300px}
#fact{grid-column:span 5;display:flex;flex-direction:column}
#news{grid-column:span 7}
#music{grid-column:span 5}
.now{display:flex;flex-direction:column;gap:4px}
.big{font-size:clamp(64px,9vw,104px);font-weight:700;line-height:.95;letter-spacing:-2px}
.cond{font-size:22px;font-weight:600}
.meta{opacity:.85;font-size:15px}
#wxicon{width:clamp(110px,16vw,160px);height:auto;align-self:start;filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.hours{grid-column:1/-1;display:flex;gap:2px;overflow-x:auto;margin:10px -6px 0;padding:0 0 6px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.4) transparent}
.hr{flex:0 0 58px;text-align:center;font-size:13px;padding:6px 0;border-radius:12px;scroll-snap-align:start}
.hr.now{background:rgba(255,255,255,.16)}.hr svg{width:34px;height:34px;display:block;margin:2px auto}.hr b{font-size:15px;font-weight:600}.hr i{display:block;font-style:normal;font-size:12px;color:#cfe0ff;min-height:16px}
.days{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px;border-top:1px solid rgba(255,255,255,.25);padding-top:14px}
.day{text-align:center;font-size:14px}.day svg{width:40px;height:40px;display:block;margin:2px auto}
.day b{font-weight:600}.day span{opacity:.75}
.nw{white-space:nowrap}
#facttext{font-size:clamp(20px,2.4vw,30px)}
.place{grid-column:1/-1;font-size:13px;opacity:.75}
#facttext{font-size:clamp(20px,2.2vw,26px);line-height:1.35;font-weight:500;flex:1;margin:4px 0 16px;text-wrap:pretty}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.chip{font:600 14px Inter,sans-serif;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#items{list-style:none;padding:0;margin:14px 0 0}
#items li{border-top:1px solid var(--line)}
#items a{display:block;padding:12px 2px;text-decoration:none;font-weight:500}
#items a:hover .t{text-decoration:underline}
#items small{display:block;color:var(--mut);font-weight:400;font-size:13px;margin-top:2px}
.note{color:var(--mut);font-size:14px}
.dial{position:relative;height:56px;border-radius:12px;background:var(--bg);border:1px solid var(--line);margin-bottom:16px;overflow:hidden}
.ticks{position:absolute;inset:8px 12px 22px;background:repeating-linear-gradient(90deg,var(--mut) 0 1px,transparent 1px 5%)}
.nums{position:absolute;left:12px;right:12px;bottom:4px;display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
#needle{position:absolute;top:4px;bottom:4px;width:3px;margin-left:-1px;background:var(--acc);border-radius:2px;left:calc(12px + (100% - 24px) * .935);transition:left .9s cubic-bezier(.3,1.4,.5,1)}
.pins{margin-bottom:18px}
.tracks{list-style:none;padding:0;margin:0 0 12px}
.tracks li{border-top:1px solid var(--line)}
.tracks a{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;text-decoration:none}
.tracks .s{font-weight:600}.tracks .a{color:var(--mut);font-size:14px}
.tracks .go{color:var(--acc);font-weight:700;white-space:nowrap}
h3{font-size:14px;font-weight:600;color:var(--mut);margin:0 0 6px}
@media(max-width:860px){#wx,#fact,#news,#music{grid-column:1/-1}#fact{order:3}#news{order:2}#music{order:4}}
@media(max-width:480px){.days{gap:2px}.day{font-size:13px}.day svg{width:32px;height:32px}#wx{padding:18px}}
@media(prefers-reduced-motion:reduce){#needle{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="greet">Good morning</h1><div id="date"></div></header>
  <main class="grid">
    <section id="wx" class="card" aria-label="Weather">
      <div class="now"><div class="big" id="temp">--°</div><div class="cond" id="cond">Loading weather…</div><div class="meta" id="wxmeta"></div></div>
      <svg id="wxicon" viewBox="0 0 64 64" aria-hidden="true"></svg>
      <div class="hours" id="hours" aria-label="Hourly forecast"></div>
      <div class="days" id="days"></div>
      <div class="place" id="wxplace"></div>
    </section>
    <section id="fact" class="card" aria-label="Fact of the day">
      <h2 id="facthead">Fact of the day</h2>
      <p id="facttext"></p>
      <div class="row"><button id="prevfact" type="button">Previous</button><button id="nextfact" type="button">Another one</button></div>
    </section>
    <section id="news" class="card" aria-label="News">
      <h2>Headlines</h2>
      <div class="row tabs" id="tabs" role="tablist"></div>
      <ul id="items"></ul>
    </section>
    <section id="music" class="card" aria-label="Music">
      <h2>On the dial</h2>
      <div class="dial" aria-hidden="true"><div class="ticks"></div><div class="nums"><span>88</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108</span></div><div id="needle"></div></div>
      <h3>Quick play</h3>
      <div class="row pins" id="pins"></div>
      <h3 id="rothead">Today's rotation · LA alt radio, 2009–2011</h3>
      <ul class="tracks" id="tracks"></ul>
      <button id="shuffle" type="button">Spin the dial</button>
    </section>
  </main>
</div>
<script>
{
/* ---------- Edit these to make it yours ---------- */
const CONFIG = {
  place: 'Teaneck, NJ', lat: 40.8976, lon: -74.0160, tz: 'America/New_York',
  feeds: [
    { name: 'NPR', url: 'https://feeds.npr.org/1001/rss.xml' },
    { name: 'BBC', url: 'https://feeds.bbci.co.uk/news/rss.xml' },
    { name: 'Ars Technica', url: 'https://feeds.arstechnica.com/arstechnica/index' }
  ],
  // Paste your own YouTube Music playlist URLs here as {label, url}
  pins: [
    { label: 'YouTube Music', url: 'https://music.youtube.com/' },
    { label: 'My library', url: 'https://music.youtube.com/library' },
    { label: 'Kanye West', q: 'Kanye West' },
    { label: 'The Strokes', q: 'The Strokes' },
    { label: 'Muse', q: 'Muse' }
  ]
};
const TRACKS = [
  ['Phoenix','1901'],['Phoenix','Lisztomania'],['MGMT','Kids'],['Kings of Leon','Use Somebody'],['Muse','Uprising'],
  ['Silversun Pickups','Panic Switch'],['Cage the Elephant',"Ain't No Rest for the Wicked"],['Cage the Elephant','Shake Me Down'],
  ['The Temper Trap','Sweet Disposition'],['Empire of the Sun','Walking on a Dream'],['Yeah Yeah Yeahs','Heads Will Roll'],
  ['Vampire Weekend','Cousins'],['Passion Pit','Sleepyhead'],['Two Door Cinema Club','What You Know'],['Foster the People','Pumped Up Kicks'],
  ['Young the Giant','My Body'],['AWOLNATION','Sail'],['Mumford & Sons','Little Lion Man'],['Edward Sharpe & the Magnetic Zeros','Home'],
  ['The Black Keys','Tighten Up'],['Linkin Park','Waiting for the End'],['Thirty Seconds to Mars','Kings and Queens'],
  ['Foo Fighters','Rope'],['Arcade Fire','Ready to Start'],['Florence + the Machine','Dog Days Are Over'],['Neon Trees','Animal'],
  ['Arctic Monkeys','Crying Lightning'],['Them Crooked Vultures','New Fang'],['Metric','Help I\'m Alive'],['Gorillaz','Stylo'],
  ['Julian Casablancas','11th Dimension'],['The Naked and Famous','Young Blood'],['Matt and Kim','Daylight'],['Grouplove','Tongue Tied'],
  ['Kid Cudi','Pursuit of Happiness'],['Muse','Resistance'],['Weezer','(If You\'re Wondering If I Want You To) I Want You To'],['The Killers','Human']
];
const FACTS = [
  'Octopuses have three hearts: two pump blood through the gills, one through the rest of the body.',
  'Botanically, bananas are berries and strawberries are not.',
  'A day on Venus (about 243 Earth days) is longer than its year (about 225 Earth days).',
  'Wombats produce cube-shaped droppings.',
  'The Eiffel Tower grows up to about 15 cm taller in summer as its iron expands in the heat.',
  'Sharks have been around longer than trees: roughly 450 million years versus about 385 million.',
  'Teaching was happening at Oxford by 1096, more than two centuries before the Aztecs founded Tenochtitlan in 1325.',
  'Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramid of Giza.',
  'A group of flamingos is called a flamboyance.',
  'Sunlight takes about 8 minutes and 20 seconds to reach Earth.',
  'Nintendo was founded in 1889 as a maker of playing cards.',
  'The Anglo-Zanzibar War of 1896 is considered the shortest war on record, lasting under an hour.',
  "Scotland's national animal is the unicorn.",
  'The dot over a lowercase i or j is called a tittle.',
  'Venus is hotter than Mercury, even though Mercury is closer to the Sun, because of its thick CO₂ atmosphere.',
  'A teaspoon of neutron star material would weigh around a billion tons on Earth.',
  'The Great Wall of China is not visible to the naked eye from the Moon.',
  'A lightning bolt can reach about 30,000 K, roughly five times hotter than the surface of the Sun.',
  "Some of the ashes of Fredric Baur, who designed the Pringles can, were buried in one.",
  'There are more possible chess games than atoms in the observable universe.',
  'Saturn is less dense than water.',
  "The first webcam pointed at a coffee pot in Cambridge University's computer lab so people could see if it was empty.",
  'In 1947, engineers on the Harvard Mark II found an actual moth in a relay and taped it into the logbook as the "first actual case of bug being found."',
  'Sea otters sometimes hold hands while sleeping so they don\'t drift apart.',
  'Butterflies taste with sensors on their feet.',
  'The word "robot" comes from Karel Čapek\'s 1920 play R.U.R., from the Czech robota, meaning forced labor.',
  'Tardigrades have survived direct exposure to the vacuum of space.',
  'Pluto has not completed a single orbit since it was discovered in 1930. One lap takes about 248 years.',
  'The Moon is drifting away from Earth at about 3.8 cm per year.',
  'The adult human body has 206 bones; babies are born with around 300 that fuse over time.',
  'Mount Everest still rises a few millimeters each year as the Indian plate pushes into Asia.',
  "The Strokes' debut album Is This It got a different cover in the US than in the UK.",
  "Kanye West produced several tracks on Jay-Z's The Blueprint (2001), including \"Izzo (H.O.V.A.)\".",
  "Phoenix's Wolfgang Amadeus Phoenix won the Grammy for Best Alternative Music Album in 2010.",
  'Honey found in ancient Egyptian tombs has been reported to still be edible thousands of years later.',
  'Koala fingerprints are so similar to human ones that they are hard to tell apart even under a microscope.',
  'The human stomach replaces the cells of its inner lining every few days.',
  'A single cloud can weigh more than a million pounds.',
  'The Hawaiian alphabet has just 13 letters, counting the ʻokina.',
  'An ostrich\'s eye is bigger than its brain.'
];
/* ------------------------------------------------- */

const $ = id => document.getElementById(id);
const get = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const ytm = q => 'https://music.youtube.com/search?q=' + encodeURIComponent(q);
const now = new Date();
const doy = Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(now.getFullYear(), 0, 0)) / 864e5);
const ago = t => { const m = Math.round((Date.now() - t) / 6e4); return m < 60 ? Math.max(m, 1) + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };

/* Header clock */
function tick() {
  const d = new Date(), h = d.getHours();
  $('greet').textContent = h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  $('date').textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) + ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}
tick(); setInterval(tick, 20000);

/* Weather */
const wmo = c => c === 0 ? ['Clear', 'sun'] : c <= 2 ? ['Partly cloudy', 'part'] : c === 3 ? ['Overcast', 'cloud'] : c <= 48 ? ['Fog', 'fog'] :
  c <= 57 ? ['Drizzle', 'rain'] : c <= 67 ? ['Rain', 'rain'] : c <= 77 ? ['Snow', 'snow'] : c <= 82 ? ['Showers', 'rain'] : c <= 86 ? ['Snow showers', 'snow'] : ['Thunderstorms', 'storm'];
const CLOUD = '<path d="M20 48h27a10 10 0 0 0 1-20 15 15 0 0 0-28-4 12 12 0 0 0 0 24z" fill="#fff"/><path d="M20 48h27a10 10 0 0 0 9-6H12a12 12 0 0 0 8 6z" fill="#c9d6ff" opacity=".7"/>';
function icon(kind, night) {
  const sun = (x, y, r) => night
    ? `<path d="M${x + r * .3} ${y - r}a${r} ${r} 0 1 0 ${r * .7} ${r * 1.7}a${r * .8} ${r * .8} 0 0 1-${r * .7}-${r * 1.7}z" fill="#ffe28a"/>`
    : `<g stroke="#ffd23f" stroke-width="3" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a => { const t = a * Math.PI / 180; return `<line x1="${x + Math.cos(t) * (r + 4)}" y1="${y + Math.sin(t) * (r + 4)}" x2="${x + Math.cos(t) * (r + 9)}" y2="${y + Math.sin(t) * (r + 9)}"/>`; }).join('')}</g><circle cx="${x}" cy="${y}" r="${r}" fill="#ffd23f"/>`;
  if (kind === 'sun') return sun(32, 32, 13);
  if (kind === 'part') return sun(24, 22, 10) + CLOUD;
  if (kind === 'cloud') return CLOUD;
  if (kind === 'fog') return '<g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"><line x1="12" y1="24" x2="52" y2="24"/><line x1="8" y1="34" x2="48" y2="34"/><line x1="16" y1="44" x2="56" y2="44"/></g>';
  const under = kind === 'snow' ? '<g fill="#fff">' + [18, 30, 42].map(x => `<circle cx="${x}" cy="56" r="3"/>`).join('') + '</g>'
    : kind === 'storm' ? '<path d="M33 46l-7 11h7l-4 7 11-12h-7l4-6z" fill="#ffd23f"/>'
    : '<g stroke="#bcd0ff" stroke-width="3" stroke-linecap="round">' + [20, 32, 44].map(x => `<line x1="${x}" y1="52" x2="${x - 3}" y2="60"/>`).join('') + '</g>';
  return `<g transform="translate(0 -6)">${CLOUD}</g>` + under;
}
function renderWx(d, t) {
  const c = d.current, dy = d.daily, [label, kind] = wmo(c.weather_code);
  $('temp').textContent = Math.round(c.temperature_2m) + '°';
  $('cond').textContent = label;
  const hm = s => new Date(s).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  $('wxmeta').innerHTML = [`H ${Math.round(dy.temperature_2m_max[0])}° L ${Math.round(dy.temperature_2m_min[0])}°`, `Feels like ${Math.round(c.apparent_temperature)}°`, `Wind ${Math.round(c.wind_speed_10m)} mph`, `Rain ${dy.precipitation_probability_max[0] ?? 0}%`, `Sunset ${hm(dy.sunset[0])}`].map(x => `<span class="nw">${x}</span>`).join(' · ');
  $('wxicon').innerHTML = icon(kind, !c.is_day);
  const h = d.hourly;
  if (h) {
    const curHour = (c.time || '').slice(0, 13);
    let i0 = h.time.findIndex(t => t.slice(0, 13) >= curHour); if (i0 < 0) i0 = 0;
    const toMidnight = h.time.slice(i0).findIndex(t => t.slice(11, 13) === '00' && t.slice(0, 13) !== curHour);
    const n = Math.max(8, toMidnight < 0 ? 12 : toMidnight);
    $('hours').innerHTML = h.time.slice(i0, i0 + n).map((t, k) => {
      const j = i0 + k, hr = +t.slice(11, 13), lbl = k === 0 ? 'Now' : (hr % 12 || 12) + (hr < 12 ? ' AM' : ' PM');
      const p = h.precipitation_probability[j] ?? 0;
      return `<div class="hr${k === 0 ? ' now' : ''}">${lbl}<svg viewBox="0 0 64 64" aria-hidden="true">${icon(wmo(h.weather_code[j])[1], !h.is_day[j])}</svg><b>${Math.round(h.temperature_2m[j])}°</b><i>${p >= 10 ? p + '%' : ''}</i></div>`;
    }).join('');
  }
  $('days').innerHTML = dy.time.slice(1, 6).map((s, i) => {
    const k = wmo(dy.weather_code[i + 1])[1], name = new Date(s + 'T12:00').toLocaleDateString(undefined, { weekday: 'short' });
    return `<div class="day"><b>${name}</b><svg viewBox="0 0 64 64" aria-hidden="true">${icon(k, false)}</svg><b>${Math.round(dy.temperature_2m_max[i + 1])}°</b> <span>${Math.round(dy.temperature_2m_min[i + 1])}°</span></div>`;
  }).join('');
  $('wxplace').textContent = CONFIG.place + ' · updated ' + ago(t);
}
async function loadWx() {
  const cached = get('wx');
  if (cached) renderWx(cached.d, cached.t);
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunset&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=${encodeURIComponent(CONFIG.tz)}&forecast_days=6`;
    const r = await fetch(u); if (!r.ok) throw 0;
    const d = await r.json(); put('wx', { d, t: Date.now() }); renderWx(d, Date.now());
  } catch (e) { if (!cached) $('cond').textContent = 'Weather unavailable right now'; }
}
loadWx(); setInterval(loadWx, 15 * 6e4);

/* Fact of the day */
let fi = doy % FACTS.length;
const showFact = () => { $('facttext').textContent = FACTS[fi]; $('facthead').textContent = fi === doy % FACTS.length ? 'Fact of the day' : 'Bonus fact'; };
$('nextfact').addEventListener('click', () => { fi = (fi + 1) % FACTS.length; showFact(); });
$('prevfact').addEventListener('click', () => { fi = (fi - 1 + FACTS.length) % FACTS.length; showFact(); });
showFact();

/* News */
let feed = get('feedTab') ?? 0; if (!CONFIG.feeds[feed]) feed = 0;
function renderTabs() {
  $('tabs').innerHTML = CONFIG.feeds.map((f, i) => `<button type="button" role="tab" aria-selected="${i === feed}" data-i="${i}">${esc(f.name)}</button>`).join('');
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; feed = +b.dataset.i; put('feedTab', feed); renderTabs(); loadFeed(); });
function renderItems(items, note) {
  $('items').innerHTML = items.slice(0, 8).map(it => `<li><a href="${esc(it.l)}" target="_blank" rel="noopener"><span class="t">${esc(it.t)}</span><small>${it.d ? ago(it.d) : ''}</small></a></li>`).join('') + (note ? `<li class="note" style="padding-top:10px">${note}</li>` : '');
}
async function loadFeed() {
  const f = CONFIG.feeds[feed], key = 'feed:' + f.url, cached = get(key);
  if (cached) renderItems(cached.items);
  else $('items').innerHTML = '<li class="note" style="padding-top:12px">Loading headlines…</li>';
  if (cached && Date.now() - cached.t < 15 * 6e4) return;
  try {
    const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(f.url));
    const j = await r.json(); if (j.status !== 'ok') throw 0;
    const items = j.items.map(x => ({ t: x.title, l: x.link, d: x.pubDate ? Date.parse(x.pubDate.replace(' ', 'T') + 'Z') : 0 }));
    put(key, { items, t: Date.now() }); if (CONFIG.feeds[feed] === f) renderItems(items);
  } catch (e) { if (!cached) renderItems([], 'Couldn\'t load this feed right now.'); }
}
renderTabs(); loadFeed();

/* Music */
$('pins').innerHTML = CONFIG.pins.map(p => `<a class="chip" href="${esc(p.url || ytm(p.q))}" target="_blank" rel="noopener">${esc(p.label)}</a>`).join('');
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let spin = 0;
function rotation() {
  const r = rng(now.getFullYear() * 1000 + doy + spin * 7919), pool = TRACKS.slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  $('tracks').innerHTML = pool.slice(0, 4).map(([a, s]) => `<li><a href="${esc(ytm(a + ' ' + s))}" target="_blank" rel="noopener"><span><span class="s">${esc(s)}</span><br><span class="a">${esc(a)}</span></span><span class="go">Play ›</span></a></li>`).join('');
  $('rothead').textContent = spin ? 'Fresh spin · LA alt radio, 2009–2011' : "Today's rotation · LA alt radio, 2009–2011";
}
$('shuffle').addEventListener('click', () => {
  spin++; const n = $('needle');
  n.style.left = `calc(12px + (100% - 24px) * ${(0.05 + Math.random() * 0.8).toFixed(3)})`;
  setTimeout(() => { n.style.left = ''; }, 650);
  rotation();
});
rotation();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>

# Builds the Android app (Capacitor shell around the live site) and publishes the APK to the
# "android-latest" release: https://github.com/eyrek/daily-dashboard/releases/download/android-latest/dashboard.apk
name: android
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'app-shell/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci --no-audit --no-fund
      - run: npx cap sync android
      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk dashboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-apk
          path: dashboard.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dashboard.apk \
            --title "Dashboard for Android (build ${{ github.run_number }})" \
            --notes "Install on your phone: open this page in Chrome, tap dashboard.apk, then allow installs from Chrome when asked. The app loads the live dashboard, so most updates arrive without reinstalling."

# Generated by scripts/gen-workflow.mjs from reminders.json. Don't edit by hand.
name: reminders
on:
  schedule:
    - cron: '25 0 * * *'
    - cron: '25 1 * * *'
    - cron: '57 22 * * *'
    - cron: '57 23 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification now'
        type: boolean
        default: true
permissions:
  contents: read
concurrency: reminders
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - run: node scripts/send-reminders.mjs
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          SCHEDULE: ${{ github.event.schedule }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
